services:
  - type: web
    name: vishwakarma-hardware-sanitary
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: ADMIN_PIN
        value: "0206"
      - key: JWT_SECRET
        generateValue: true
      - key: DATA_FILE
        value: /opt/render/project/src/data/catalog.json
    disk:
      name: catalog-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
